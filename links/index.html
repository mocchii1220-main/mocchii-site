<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Links</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for UI icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts (Inter & Noto Sans JP) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans JP', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans bg-[#f7f7f8] text-neutral-800 min-h-screen flex flex-col justify-between antialiased selection:bg-neutral-200 relative">

    <!-- =========================================================
         【背景画像の設定】
         下記 style 属性の url('...') 内に、ご希望の背景画像URLを貼り付けてください。
         ローカル画像の場合は style="background-image: url('./my-bg.jpg');" のように指定できます。
         ========================================================= -->
    <div class="fixed inset-0 -z-10 bg-cover bg-center bg-no-repeat bg-fixed"
         style="background-image: url('./bg.jpg');">
        <!-- 文字の視認性を高めるためのオーバーレイ（背景画像に合わせて不透明度や色を調整可能） -->
        <div class="absolute inset-0 bg-white/40 backdrop-blur-[0px]"></div>
    </div>

    <!-- Main Content Container -->
    <main class="relative z-10 w-full max-w-sm mx-auto px-5 py-12 sm:py-16 flex flex-col items-center">

        <!-- Profile Section -->
        <div class="text-center mb-9 w-full flex flex-col items-center">
            <!-- Avatar Icon/Image -->
            <div class="mb-4">
                <img 
                    src="./icon.png" 
                    alt="Profile Avatar" 
                    class="w-24 h-24 sm:w-28 sm:h-28 rounded-full object-cover border border-neutral-200 shadow-sm"
                    onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%23a3a3a3\'><path d=\'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm0 14c-2.03 0-3.8-1.03-4.84-2.6.03-1.6 3.23-2.4 4.84-2.4 1.6 0 4.81.8 4.84 2.4-1.04 1.57-2.81 2.6-4.84 2.6z\'/></svg>'"
                >
            </div>

            <!-- Name & Username -->
            <h1 class="text-xl sm:text-2xl font-semibold tracking-tight text-neutral-900 mb-0.5">
                つぶな/もっちー
            </h1>

        </div>

        <!-- Links Section -->
        <div class="w-full space-y-3">

            <!-- 1. YouTube -->
            <a href="https://www.youtube.com/@tsubuna" target="_blank" rel="noopener noreferrer" 
               class="w-full p-3.5 rounded-xl bg-white border border-neutral-200/90 hover:border-neutral-400 active:scale-[0.99] flex items-center justify-between group transition-all duration-150 shadow-sm">
                <div class="flex items-center gap-3.5">
                    <!-- 【アイコン画像】 src="..." に任意の画像URLまたはファイルパスを指定 -->
                    <div class="w-8 h-8 flex items-center justify-center shrink-0">
                        <img src="https://cdn.simpleicons.org/youtube/FF0000" 
                             alt="YouTube Icon" 
                             class="w-6 h-6 object-contain"
                             onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%23FF0000\'><path d=\'M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z\'/></svg>'">
                    </div>
                    <div class="text-left">
                        <div class="font-medium text-neutral-800 text-sm">YouTube</div>
                        <div class="text-[11px] text-neutral-500">音madとか...</div>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square text-neutral-300 group-hover:text-neutral-600 transition-colors text-xs pr-1"></i>
            </a>
            <!-- 2. Twitter / X (Main) -->
            <a href="https://x.com/mocchiitt" target="_blank" rel="noopener noreferrer" 
               class="w-full p-3.5 rounded-xl bg-white border border-neutral-200/90 hover:border-neutral-400 active:scale-[0.99] flex items-center justify-between group transition-all duration-150 shadow-sm">
                <div class="flex items-center gap-3.5">
                    <!-- 【アイコン画像】 -->
                    <div class="w-8 h-8 flex items-center justify-center shrink-0">
                        <img src="https://cdn.simpleicons.org/x/000000" 
                             alt="X Main Icon" 
                             class="w-5 h-5 object-contain"
                             onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%23000000\'><path d=\'M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z\'/></svg>'">
                    </div>
                    <div class="text-left">
                        <div class="font-medium text-neutral-800 text-sm">X (Main)</div>
                        <div class="text-[11px] text-neutral-500">メイン</div>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square text-neutral-300 group-hover:text-neutral-600 transition-colors text-xs pr-1"></i>
            </a>

            <!-- 3. Twitter / X (Sub) -->
            <a href="https://x.com/mocchii1220sub" target="_blank" rel="noopener noreferrer" 
               class="w-full p-3.5 rounded-xl bg-white border border-neutral-200/90 hover:border-neutral-400 active:scale-[0.99] flex items-center justify-between group transition-all duration-150 shadow-sm">
                <div class="flex items-center gap-3.5">
                    <!-- 【アイコン画像】 -->
                    <div class="w-8 h-8 flex items-center justify-center shrink-0">
                        <img src="https://cdn.simpleicons.org/x/0ea5e9" 
                             alt="X Sub Icon" 
                             class="w-5 h-5 object-contain"
                             onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 24 24\' fill=\'%230ea5e9\'><path d=\'M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z\'/></svg>'">
                    </div>
                    <div class="text-left">
                        <div class="font-medium text-neutral-800 text-sm">X (Sub)</div>
                        <div class="text-[11px] text-neutral-500">サブ　鍵アカ</div>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square text-neutral-300 group-hover:text-neutral-600 transition-colors text-xs pr-1"></i>
            </a>

        </div>

    </main>

</body>
</html>
