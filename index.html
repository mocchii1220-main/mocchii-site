<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Links</title>
  <style>
    :root {
      --bg-color: #0d0f17;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-color: #f1f5f9;
      --text-sub: #94a3b8;
      
      --x-color: #1da1f2;
      --youtube-color: #ff0000;
      --discord-color: #5865f2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    /* 背景のアニメーションオーブ */
    .bg-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(88, 101, 242, 0.15) 0%, rgba(13, 15, 23, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      animation: pulse 8s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes pulse {
      0% {
        transform: translate(-50%, -50%) scale(0.8);
        opacity: 0.5;
      }
      100% {
        transform: translate(-50%, -50%) scale(1.2);
        opacity: 0.9;
      }
    }

    /* メインコンテナ */
    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 2.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      background: rgba(13, 15, 23, 0.4);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* プロフィールアイコン風のアニメーショングラフィック */
    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 8px 25px rgba(168, 85, 247, 0.3);
      animation: float 4s ease-in-out infinite;
    }

    .avatar-inner {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 1.5rem;
      color: #fff;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* タイトル情報 */
    .profile-info {
      text-align: center;
    }

    .profile-info h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
    }

    .profile-info p {
      font-size: 0.875rem;
      color: var(--text-sub);
    }

    /* リンク一覧 */
    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .link-card {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 1rem 1.25rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      color: var(--text-color);
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }

    /* ホバー時のバックライトエフェクト */
    .link-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.08),
        transparent
      );
      transition: left 0.6s ease;
    }

    .link-card:hover::before {
      left: 100%;
    }

    .link-card:hover {
      transform: translateY(-3px) scale(1.02);
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    /* ブランド個別のカラーホバー */
    .link-card.twitter:hover {
      border-color: var(--x-color);
      box-shadow: 0 0 20px rgba(29, 161, 242, 0.3);
    }
    .link-card.youtube:hover {
      border-color: var(--youtube-color);
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
    }
    .link-card.discord:hover {
      border-color: var(--discord-color);
      box-shadow: 0 0 20px rgba(88, 101, 242, 0.3);
    }

    .link-content {
      display: flex;
      align-items: center;
      gap: 0.875rem;
    }

    .link-icon {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    .arrow-icon {
      width: 18px;
      height: 18px;
      fill: var(--text-sub);
      transition: transform 0.3s ease, fill 0.3s ease;
    }

    .link-card:hover .arrow-icon {
      transform: translateX(4px);
      fill: var(--text-color);
    }

    /* コピーダイアログ (Discord用) */
    .toast {
      position: fixed;
      bottom: 2rem;
      background: rgba(88, 101, 242, 0.9);
      color: #fff;
      padding: 0.75rem 1.5rem;
      border-radius: 30px;
      font-size: 0.875rem;
      font-weight: 600;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 10;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <div class="container">
    <!-- アバターロゴ -->
    <div class="avatar">
      <div class="avatar-inner">Link</div>
    </div>

    <!-- プロフィールテキスト -->
    <div class="profile-info">
      <h1>My Links</h1>
      <p>Socials & Official Channels</p>
    </div>

    <!-- リンク一覧 -->
    <div class="links-list">

      <!-- Twitter (X) -->
      <a href="https://twitter.com/" target="_blank" rel="noopener noreferrer" class="link-card twitter">
        <div class="link-content">
          <svg class="link-icon" viewBox="0 0 24 24">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
          <span>Twitter (X)</span>
        </div>
        <svg class="arrow-icon" viewBox="0 0 24 24">
          <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>

      <!-- YouTube -->
      <a href="https://youtube.com/" target="_blank" rel="noopener noreferrer" class="link-card youtube">
        <div class="link-content">
          <svg class="link-icon" viewBox="0 0 24 24">
            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
          </svg>
          <span>YouTube</span>
        </div>
        <svg class="arrow-icon" viewBox="0 0 24 24">
          <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>

      <!-- Discord (クリックでID/招待をコピー・遷移) -->
      <a href="https://discord.com/" target="_blank" rel="noopener noreferrer" class="link-card discord" id="discord-link">
        <div class="link-content">
          <svg class="link-icon" viewBox="0 0 24 24">
            <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
          </svg>
          <span>Discord</span>
        </div>
        <svg class="arrow-icon" viewBox="0 0 24 24">
          <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </a>

    </div>
  </div>

  <div class="toast" id="toast">Discordのリンクへ移動します</div>

  <script>
    // 各URLを自分のものに書き換えてください
    const LINKS = {
      twitter: "https://twitter.com/your_account",
      youtube: "https://youtube.com/@your_channel",
      discord: "https://discord.gg/your_invite" // サーバー招待リンクまたはプロフィールリンク
    };

    document.querySelector('.link-card.twitter').href = LINKS.twitter;
    document.querySelector('.link-card.youtube').href = LINKS.youtube;
    document.querySelector('.link-card.discord').href = LINKS.discord;
  </script>
</body>
</html>
