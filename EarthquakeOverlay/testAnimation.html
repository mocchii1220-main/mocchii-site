<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>SVGロゴアニメーション</title>
    <style>
        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .logo-container {
            width: 100%;
            max-width: 600px;
        }

        /* 全体の初期設定（最初は透明にしておく） */
        .anim-fade, .anim-line {
            opacity: 0;
            animation-fill-mode: forwards !important;
        }

        /* パーツ1：メインの文字ロゴ群（1秒かけてフェードイン） */
        .anim-fade {
            animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.5s; }

        /* パーツ2：下線の長方形（左から右へスッと伸びる） */
        .anim-line {
            transform-origin: left center;
            animation: scaleXIn 1s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .delay-3 { animation-delay: 0.8s; }
        .delay-4 { animation-delay: 1.0s; }

        /* アニメーションの動きの定義 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scaleXIn {
            from {
                opacity: 0;
                transform: scaleX(0);
            }
            to {
                opacity: 1;
                transform: scaleX(1);
            }
        }
    </style>
</head>
